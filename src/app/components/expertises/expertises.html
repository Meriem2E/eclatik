<section class="expertises section" id="expertises">
  <div class="container">
    <div class="expertises__head">
      <p class="eyebrow">Nos expertises</p>
      <p class="expertises__note">Une approche intégrée, des résultats concrets.</p>
      <a href="#realisations" class="expertises__link">
        Voir toutes nos expertises
        <span class="icon-circle icon-circle--sm">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M8.5 3.5 13 8l-4.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </a>
    </div>

    <div class="expertises__grid">
      <article class="expertise-card" *ngFor="let exp of expertises">
        <span class="expertise-card__icon">
          <svg *ngIf="exp.icon === 'target'" width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/></svg>
          <svg *ngIf="exp.icon === 'bulb'" width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.46 1 1.2 1 1.98V16h5.2v-.22c0-.78.4-1.52 1-1.98A6 6 0 0 0 12 3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          <svg *ngIf="exp.icon === 'monitor'" width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="3" y="4.5" width="18" height="12" rx="1.4" stroke="currentColor" stroke-width="1.6"/><path d="M8 20.5h8M12 16.5v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <svg *ngIf="exp.icon === 'megaphone'" width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3 10v4a1 1 0 0 0 1 1h2l6 4V5L6 9H4a1 1 0 0 0-1 1Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M18 9a4 4 0 0 1 0 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </span>
        <h3>{{ exp.title }}</h3>
        <ul>
          <li *ngFor="let item of exp.items">{{ item }}</li>
        </ul>
        <a href="#contact" class="icon-circle expertise-card__arrow" aria-label="En savoir plus sur {{ exp.title }}">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M8.5 3.5 13 8l-4.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </article>
    </div>
  </div>
</section>

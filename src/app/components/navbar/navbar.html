<header class="nav" [class.nav--scrolled]="isScrolled()">
  <div class="container nav__inner">
    <a href="#top" class="nav__brand" (click)="closeMenu()">
      <!-- <span class="nav__logo">éclatik</span>
      <span class="nav__tagline">Plus d'éclat. Plus d'impact.</span> -->
      <img class="nav__logo" src="assets/images/logo-eclatik.jpg" alt="">
    </a>

    <nav class="nav__links" aria-label="Navigation principale">
      <a *ngFor="let link of links" [href]="link.href">{{ link.label }}</a>
    </nav>

    <div class="nav__actions">
      <a href="#contact" class="btn btn-primary nav__cta">
        Nous contacter
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M8.5 3.5 13 8l-4.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <button class="nav__lang" type="button" aria-label="Choisir la langue">
        FR
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="m2.5 4.5 3.5 3 3.5-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="nav__burger" type="button" (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen()" aria-label="Ouvrir le menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>

  <nav class="nav__mobile" *ngIf="isMenuOpen()" aria-label="Navigation mobile">
    <a *ngFor="let link of links" [href]="link.href" (click)="closeMenu()">{{ link.label }}</a>
  </nav>
</header>
